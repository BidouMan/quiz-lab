[package]
name = "quizlab"
version = "0.7.0-beta.1"
description = "QuizLab 数学每日一练"
edition = "2021"

[lib]
name = "quizlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
